[package]
name = "micro-card"
version = "0.1.0"
description = "Card-style knowledge capture that syncs with your Obsidian vault"
authors = ["Micro Card"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Android/iOS entry points need a cdylib; the desktop binary uses the rlib.
name = "micro_card_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
walkdir = "2"
rand = "0.8"
sha1 = "0.10"
base64 = "0.22"
# rustls rather than native-tls: no OpenSSL to cross-compile for Android.
# Native roots so the platform trust store is honoured — that is what makes the
# app work behind a corporate proxy, and on Android where the system store is
# where user-installed certificates live.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-native-roots",
    "charset",
    "http2",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
